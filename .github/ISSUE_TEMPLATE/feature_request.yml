name: Feature request
description: Suggest an idea for ApiMonitor
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** never paste real API keys or credential data.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
