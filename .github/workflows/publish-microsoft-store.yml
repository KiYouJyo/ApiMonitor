name: Publish Microsoft Store update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact main HEAD, or a tag resolving to the exact main HEAD'
        required: true
        default: main
        type: string
      publication_confirmation:
        description: 'Type PUBLISH followed by the exact product version'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: api-monitor-microsoft-store-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9N6KR2XFMKQ2

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 75

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate source, Store identity, and versions
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $displayNode = @(
            $props.Project.PropertyGroup |
              ForEach-Object { $_.ApiMonitorDisplayVersion } |
              Where-Object { $_ }
          )[0]
          $packageNodes = @(
            $props.Project.PropertyGroup |
              ForEach-Object { $_.ApiMonitorPackageVersion } |
              Where-Object { $_ }
          )
          $packageNode = @(
            $packageNodes |
              Where-Object { [string]$_.Condition -like '*MicrosoftStore*' }
          )[0]
          $displayVersion = if ($displayNode) { [string]$displayNode.InnerText } else { '' }
          $packageVersion = if ($packageNode) { [string]$packageNode.InnerText } else { '' }
          if ([string]::IsNullOrWhiteSpace($displayVersion) -or [string]::IsNullOrWhiteSpace($packageVersion)) {
            throw 'Unable to resolve ApiMonitor MicrosoftStore display/package version.'
          }
          if ($displayVersion -notmatch '^\d+\.\d+\.\d+$' -or
              $packageVersion -notmatch ('^' + [regex]::Escape($displayVersion) + '\.\d+$')) {
            throw "Invalid source version pair. Product=$displayVersion Package=$packageVersion"
          }

          [xml]$storeManifest = Get-Content -LiteralPath Package.Store.appxmanifest -Raw
          $identity = $storeManifest.Package.Identity
          if ([string]$identity.Name -cne 'JoKiy.ApiMonitor') {
            throw "Store identity mismatch: $($identity.Name)"
          }
          if ([string]$identity.Publisher -cne 'CN=C4E4B33A-7B77-4121-897C-7D720A5471F8') {
            throw "Store Publisher mismatch: $($identity.Publisher)"
          }
          if ([string]$identity.Version -cne $packageVersion) {
            throw "Store manifest version mismatch. Manifest=$($identity.Version) Source=$packageVersion"
          }
          if ([string]$storeManifest.Package.Properties.PublisherDisplayName -cne 'Jo Kiyō') {
            throw "Store PublisherDisplayName mismatch: $($storeManifest.Package.Properties.PublisherDisplayName)"
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main.' }
          $mainSha = (git rev-parse origin/main).Trim()
          if ($sourceSha -cne $mainSha) {
            throw "Store publication source must resolve to the exact origin/main HEAD. Source=$sourceSha Main=$mainSha"
          }
          if (git status --porcelain) {
            throw 'Store publication source must be clean before packaging.'
          }

          "product_version=$displayVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Validate publication confirmation
        shell: pwsh
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.publication_confirmation }}
          PRODUCT_VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          $expected = "PUBLISH $env:PRODUCT_VERSION"
          if ($env:PUBLICATION_CONFIRMATION -cne $expected) {
            throw "Publication confirmation is invalid. Type exactly: $expected"
          }

      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($name in @('TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET')) {
            $value = (Get-Item "env:$name").Value
            if ([string]::IsNullOrWhiteSpace($value)) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing required Store secrets: $($missing -join ', ')" }
          $tenantGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:TENANT_ID.Trim(), [ref]$tenantGuid)) { throw 'AZURE_AD_TENANT_ID is invalid.' }
          $clientGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:CLIENT_ID.Trim(), [ref]$clientGuid)) { throw 'AZURE_AD_APPLICATION_CLIENT_ID is invalid.' }

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.3.9

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'reconfigure',
            '--tenantId', $env:TENANT_ID.Trim(),
            '--sellerId', $env:SELLER_ID.Trim(),
            '--clientId', $env:CLIENT_ID.Trim(),
            '--clientSecret', $env:CLIENT_SECRET
          )
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI reconfiguration failed: $LASTEXITCODE" }
          & msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI telemetry setting failed: $LASTEXITCODE" }

      - name: Verify Store product access
        shell: pwsh
        run: |
          & msstore apps get $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store product access failed for $env:STORE_PRODUCT_ID."
          }

      - name: Restore
        run: dotnet restore ApiMonitor.slnx -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Run all tests
        run: dotnet test tests\ApiMonitor.Tests\ApiMonitor.Tests.csproj -c Release --no-restore

      - name: Run installer tooling tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\installer\Installer.Tests.ps1

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe was not found.' }
          $install = (& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath).Trim()
          if (-not $install) { throw 'Visual Studio with MSBuild was not found.' }
          $msbuild = Join-Path $install 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) { throw "MSBuild.exe was not found: $msbuild" }
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build validated Microsoft Store upload package
        id: package
        shell: pwsh
        env:
          MSBUILD_PATH: ${{ steps.msbuild.outputs.path }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          PRODUCT_VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Store identity replaces the sideload manifest only in this ephemeral runner checkout.
          Copy-Item -LiteralPath Package.Store.appxmanifest -Destination Package.appxmanifest -Force

          $output = Join-Path $env:RUNNER_TEMP 'ApiMonitor-Store'
          $appPackages = Join-Path $output 'AppPackages'
          New-Item -ItemType Directory -Force -Path $appPackages | Out-Null

          & $env:MSBUILD_PATH ApiMonitor.csproj /t:Build /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:DistributionChannel=MicrosoftStore /p:RuntimeIdentifier=win-x64 `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=StoreUpload `
            "/p:AppxPackageDir=$appPackages\" /p:Restore=false
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store package build failed: $LASTEXITCODE" }

          $uploads = @(Get-ChildItem -LiteralPath $appPackages -Recurse -Filter '*.msixupload' -File)
          if ($uploads.Count -ne 1) {
            throw "Expected exactly one .msixupload; found $($uploads.Count)."
          }
          $upload = $uploads[0]

          $validationDir = Join-Path $output 'validation'
          $validationJson = & ./packaging/Test-StorePackageIdentity.ps1 `
            -PackagePath $upload.FullName `
            -ExpectedIdentityName 'JoKiy.ApiMonitor' `
            -ExpectedPublisher 'CN=C4E4B33A-7B77-4121-897C-7D720A5471F8' `
            -ExpectedVersion $env:PACKAGE_VERSION `
            -OutputDirectory $validationDir | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Store package identity validation failed.' }
          $null = $validationJson | ConvertFrom-Json -ErrorAction Stop

          $sensitive = @(Get-ChildItem -LiteralPath $output -Recurse -File |
            Where-Object { $_.Extension -in '.pfx','.p12','.cer','.key','.pvk','.pem','.log' })
          if ($sensitive.Count -gt 0) {
            throw "Sensitive file found in Store output: $($sensitive.FullName -join ', ')"
          }

          $hash = (Get-FileHash -LiteralPath $upload.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $metadata = [ordered]@{
            sourceCommit = $env:SOURCE_SHA
            productVersion = $env:PRODUCT_VERSION
            packageVersion = $env:PACKAGE_VERSION
            package = $upload.FullName
            sha256 = $hash
            channel = 'MicrosoftStore'
            manifestIdentity = 'JoKiy.ApiMonitor'
            manifestPublisher = 'CN=C4E4B33A-7B77-4121-897C-7D720A5471F8'
            packageFamilyName = 'JoKiy.ApiMonitor_4wdwgytaw3v2m'
            storeProductId = $env:STORE_PRODUCT_ID
            buildUtc = [DateTime]::UtcNow.ToString('O')
          }
          $metadataPath = Join-Path $output 'store-package-build.json'
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $metadataPath -Encoding UTF8
          "$hash  $($upload.Name)" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii

          "package_path=$($upload.FullName)" >> $env:GITHUB_OUTPUT
          "package_file=$($upload.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "metadata_path=$metadataPath" >> $env:GITHUB_OUTPUT
          "output_dir=$output" >> $env:GITHUB_OUTPUT

      - name: Upload validated Store deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: ApiMonitor-Store-${{ steps.version.outputs.package_version }}
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.metadata_path }}
            ${{ steps.package.outputs.output_dir }}\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Revalidate package before publication
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PACKAGE_PATH -PathType Leaf)) {
            throw "Store package does not exist: $env:PACKAGE_PATH"
          }
          if ([IO.Path]::GetExtension($env:PACKAGE_PATH) -ine '.msixupload') {
            throw "Store publication artifact must be .msixupload: $env:PACKAGE_PATH"
          }
          $actual = (Get-FileHash -LiteralPath $env:PACKAGE_PATH -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -cne $env:EXPECTED_SHA256) {
            throw 'Store package changed after validation.'
          }

      - name: Publish Store package and submit for certification
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Deliberately omit --noCommit: the explicit PUBLISH <version> gate above authorizes
          # creation/commit of the Store submission and sends it to certification.
          & msstore publish $env:PACKAGE_PATH --appId $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store publication failed with exit code $LASTEXITCODE."
          }
