name: Bootstrap ApiMonitor v1.2.0 dual-channel publication

# One-off workflow; addition to main starts the release.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.2.0-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: apimonitor-v1.2.0-release-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'KiYouJyo/ApiMonitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact publication commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify product and channel identity versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<ApiMonitorDisplayVersion>1.2.0</ApiMonitorDisplayVersion>' Directory.Build.props
          grep -Fq 'Version="1.2.0.1"' Package.appxmanifest
          grep -Fq 'Version="1.2.0.0"' Package.Store.appxmanifest
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Create immutable release tag (or verify existing tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote origin refs/tags/v1.2.0 | cut -f1)"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref='refs/tags/v1.2.0' \
              --field sha="$GITHUB_SHA"
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::v1.2.0 is already bound to $existing, expected $GITHUB_SHA"
            exit 1
          else
            echo 'Release tag v1.2.0 already points to the expected source.'
          fi

      - name: Dispatch signed GitHub v1.2.0 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-github-release.yml --ref main \
            --field version='1.2.0' \
            --field dry_run='false'

      - name: Submit Microsoft Store 1.2.0.0 for certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-microsoft-store.yml --ref main \
            --field source_ref='main' \
            --field publication_confirmation='PUBLISH 1.2.0'
