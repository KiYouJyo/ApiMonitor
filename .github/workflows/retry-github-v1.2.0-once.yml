name: Resume ApiMonitor v1.2.0 GitHub Release

# The Store submission is a separate one-time operation and is not repeated.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retry-github-v1.2.0-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-signed-github-release:
    if: github.repository == 'KiYouJyo/ApiMonitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable source tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.0" --jq '.object.sha')"
          test "$tag_sha" = '9797ccc0a0d7d1abd9c12edab79b0fa5433216a6'

      - name: Dispatch GitHub release only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-github-release.yml --ref main \
            --field version='1.2.0' \
            --field dry_run='false'
