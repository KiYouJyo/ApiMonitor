name: Resume ApiMonitor v1.3.0 GitHub publication (only)

# On merging the signing-verification fix, dispatch the GitHub channel once.
# The Microsoft Store submission has already succeeded; never resubmit it.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retry-github-v1.3.0-once.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: apimonitor-v1.3.0-github-release-retry
  cancel-in-progress: false

jobs:
  trigger-release:
    if: github.repository == 'KiYouJyo/ApiMonitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check immutable v1.3.0 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.0" --jq '.object.sha')"
          test "$release_sha" = '308e81b4d3b6e1feedaba040b756ac52a037a5d9'
      - name: Dispatch signed GitHub Release (not Store)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run --repo KiYouJyo/ApiMonitor publish-github-release.yml \
            --ref main --field version='1.3.0' --field dry_run='false'
