name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ApiMonitor.slnx -p:Platform=x64

      - name: Run all tests
        run: dotnet test tests\ApiMonitor.Tests\ApiMonitor.Tests.csproj -c Debug --no-restore

      - name: Build Debug x64
        run: dotnet build ApiMonitor.slnx -c Debug -p:Platform=x64 --no-restore

      - name: Build Release x64
        run: dotnet build ApiMonitor.slnx -c Release -p:Platform=x64 --no-restore
